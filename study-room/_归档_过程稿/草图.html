<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小熊镇自习室 · 场景草图</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: #EFEAE0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2C2C2A;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 4px 0 12px; }
  .sub { font-size: 12px; color: #6b6459; margin-bottom: 14px; text-align:center; line-height:1.5; }

  .scene {
    position: relative; width: 600px; max-width: 100%; height: 420px;
    border-radius: 14px; overflow: hidden;
    background: #F3E6CC;
    box-shadow: 0 6px 22px rgba(0,0,0,.12);
  }
  .scene.night { background: #3a3346; }
  .scene.dusk  { background: #E8B98A; }

  .window {
    position:absolute; left:6%; top:8%; width:30%; height:38%;
    background:#BFE0EA; border:7px solid #E4D3B6; border-radius:5px;
    box-shadow: inset 0 0 0 2px #cfbb99;
  }
  .night .window { background:#2a3550; }
  .dusk .window  { background:#F0B27A; }
  .window::before { content:""; position:absolute; left:50%; top:0; width:6px; height:100%; background:#E4D3B6; transform:translateX(-50%); }
  .window::after  { content:""; position:absolute; top:50%; left:0; width:100%; height:6px; background:#E4D3B6; transform:translateY(-50%); }

  .shelf { position:absolute; right:4%; top:6%; width:28%; height:46%; background:#C9A06A; border-radius:4px; padding:8px; }
  .shelf .row { height:30%; margin-bottom:6px; display:flex; gap:4px; align-items:flex-end; }
  .shelf .bk { flex:1; border-radius:2px 2px 0 0; }
  .shelf .b1{background:#B25B4A;height:80%} .shelf .b2{background:#5E7C63;height:100%}
  .shelf .b3{background:#C89B4A;height:70%} .shelf .b4{background:#7A6A96;height:90%}
  .shelf .b5{background:#4E7B8C;height:75%}
  .night .shelf { filter:brightness(.55); }

  .lamp-glow {
    position:absolute; left:50%; top:20%; width:46%; height:55%;
    transform:translateX(-50%); border-radius:50%;
    background:radial-gradient(circle, rgba(255,214,130,.55) 0%, rgba(255,214,130,0) 70%);
    opacity:0; transition:opacity .4s; pointer-events:none;
  }
  .night .lamp-glow { opacity:1; }

  .bear {
    position:absolute; left:50%; top:11%;
    width:50%; transform:translateX(-50%);
    transform-origin:50% 90%;
    transition:transform .35s ease;
  }
  .bear img { width:100%; display:block; }
  .bear .bubble {
    position:absolute; right:-6%; top:6%;
    background:#fff; border:1.5px solid #d8cbb4;
    padding:7px 11px; border-radius:12px; font-size:13px; line-height:1.45;
    max-width:150px; box-shadow:0 3px 10px rgba(0,0,0,.08);
  }
  .bear .bubble::after {
    content:""; position:absolute; left:22px; bottom:-8px;
    border:8px solid transparent; border-top-color:#fff; border-bottom:0;
  }

  .desk {
    position:absolute; left:0; right:0; bottom:0; height:32%;
    background:linear-gradient(#C9A270, #B8895A);
    border-top:5px solid #9c7247;
  }
  .book {
    position:absolute; left:50%; top:-4%; transform:translateX(-50%);
    width:34%; height:20%; background:#FFFDF5; border-radius:3px;
    border:1px solid #d8c8aa; display:flex; overflow:hidden;
    box-shadow:0 3px 6px rgba(0,0,0,.1);
  }
  .book .pg { flex:1; border-right:1px solid #e0d4bc; }
  .cup {
    position:absolute; right:12%; top:20%; width:7%; height:20%;
    background:#F4EDE0; border-radius:3px 3px 9px 9px; border:1px solid #cdbfa6;
  }
  .cup::after { content:""; position:absolute; right:-30%; top:18%; width:38%; height:46%; border:3px solid #cdbfa6; border-left:0; border-radius:0 8px 8px 0; }
  .steam { position:absolute; right:14.5%; top:11%; width:3px; height:18px; background:rgba(255,255,255,.6); border-radius:3px; opacity:.7; animation:rise 3s infinite ease-in; }
  @keyframes rise { 0%{transform:translateY(6px);opacity:0} 50%{opacity:.7} 100%{transform:translateY(-8px);opacity:0} }

  .hud-timer {
    position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
    font-size:40px; font-weight:600; color:#412402; letter-spacing:2px;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .night .hud-timer { color:#F3E2C0; }
  .hud-goal {
    position:absolute; left:3%; bottom:8%; background:#FFFDF5;
    border:1px solid #d8c8aa; border-radius:10px; padding:7px 12px; font-size:13px;
  }
  .hud-goal .lbl { font-size:11px; color:#8a8073; }
  .tabs { position:absolute; right:3%; bottom:9%; display:flex; gap:5px; }
  .tabs span { font-size:11px; padding:4px 8px; border:1px solid #cdbfa6; border-radius:8px; background:rgba(255,255,255,.7); }

  .controls {
    margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:600px;
  }
  .controls button {
    font-size:13px; padding:8px 14px; border:1px solid #b9a98f;
    background:#FFFDF7; color:#2C2C2A; border-radius:10px; cursor:pointer;
  }
  .controls button.on { background:#2C2C2A; color:#fff; }
  .hint { font-size:12px; color:#6b6459; margin-top:12px; text-align:center; line-height:1.6; max-width:600px; }
</style>
</head>
<body>
  <h1>小熊镇自习室 · 场景草图</h1>
  <div class="sub">真实立绘拼的场景布局示意 —— 点下面按钮换表情、换时段、戳一下，看画面活起来的样子</div>

  <div class="scene" id="scene">
    <div class="window"></div>
    <div class="shelf">
      <div class="row"><i class="bk b1"></i><i class="bk b2"></i><i class="bk b3"></i><i class="bk b4"></i><i class="bk b5"></i></div>
      <div class="row"><i class="bk b3"></i><i class="bk b1"></i><i class="bk b5"></i><i class="bk b2"></i><i class="bk b4"></i></div>
      <div class="row"><i class="bk b4"></i><i class="bk b2"></i><i class="bk b1"></i><i class="bk b5"></i><i class="bk b3"></i></div>
    </div>
    <div class="lamp-glow"></div>

    <div class="bear" id="bear">
      <img id="bearImg" src="xiaolin-natural.png" alt="小林">
      <div class="bubble" id="bubble">我占位子啦，你也坐吧。</div>
    </div>

    <div class="desk">
      <div class="book"><div class="pg"></div><div class="pg"></div></div>
      <div class="cup"></div>
      <div class="steam"></div>
      <div class="hud-goal"><div class="lbl">今天的目标</div><div>刷完 2 套行测</div></div>
      <div class="hud-timer" id="timer">25:00</div>
      <div class="tabs"><span>白天</span><span>傍晚</span><span>深夜</span></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="setEmo('natural')">自然</button>
    <button onclick="setEmo('serious')">认真</button>
    <button onclick="setEmo('happy')">开心</button>
    <button onclick="setEmo('helpless')">无奈</button>
    <button onclick="setEmo('confused')">疑惑</button>
  </div>
  <div class="controls">
    <button onclick="setTime('day')">白天</button>
    <button onclick="setTime('dusk')">傍晚</button>
    <button onclick="setTime('night')">深夜</button>
    <button onclick="poke()">戳一下熊</button>
    <button onclick="startTimer()">开始计时</button>
    <button onclick="toggleLabels()">显示素材来源</button>
  </div>

  <div class="hint" id="hint">
    画面构成：窗户和书架是氛围背景；小林是现成半身立绘，桌沿挡住下半身 → 看起来像坐在桌前；书、杯子、台灯在桌面；气泡是它偶尔说的话。<br>
    这张先解决“像不像自习”。表情切换已能用现成 5 张立绘做到；要让它真正“在做事”（翻书、写字、喝水），才需要补那几张分图层。
  </div>

<script>
  var bearImg = document.getElementById('bearImg');
  var bubble = document.getElementById('bubble');
  var scene = document.getElementById('scene');
  var bear = document.getElementById('bear');
  var timerEl = document.getElementById('timer');
  var tick = null, left = 25*60;

  function setEmo(e){
    bearImg.src = 'xiaolin-' + e + '.png';
  }
  function setTime(t){
    scene.className = 'scene' + (t==='day'?'':(' '+t));
    if(t==='night'){ bubble.textContent='开灯啦，安静学。'; }
    else if(t==='dusk'){ bubble.textContent='天黑了，还行。'; }
    else { bubble.textContent='白天精神好。'; }
  }
  function poke(){
    var lines = ['嗯？我在看书。','你也别走神呀。','这道我看了两遍了。','再坐一会儿呗。','我也快翻页了。'];
    bubble.textContent = lines[Math.floor(Math.random()*lines.length)];
    bear.style.transform = 'translateX(-50%) rotate(-3deg)';
    setTimeout(function(){ bear.style.transform='translateX(-50%) rotate(0)'; }, 400);
  }
  function startTimer(){
    if(tick){ clearInterval(tick); tick=null; return; }
    setEmo('serious');
    tick = setInterval(function(){
      left--; var m=Math.floor(left/60), s=left%60;
      timerEl.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
      if(left<=0){ clearInterval(tick); tick=null; setEmo('happy'); bubble.textContent='完成！你也辛苦啦。'; }
    },1000);
  }
  function toggleLabels(){
    var h=document.getElementById('hint');
    h.style.display = (h.style.display==='none')?'block':'none';
  }
</script>
</body>
</html>
